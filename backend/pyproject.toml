[project]
name = "backend"
version = "0.1.0"
description = "Sistema de chamados de TI - backend"
readme = "README.md"
authors = [
    { name = "Victor Cerqueira", email = "victor.legat.cerqueira@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiomysql>=0.2.0",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic[email]>=2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
